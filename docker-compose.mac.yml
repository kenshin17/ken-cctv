# Local testing on macOS (Docker Desktop): bridge network + published ports.
# RTSP cameras (Tapo, EZTV) work; Xiaomi cameras do NOT (UDP P2P dropped by Docker Desktop's NAT).
# Usage: docker compose -f docker-compose.mac.yml up -d

services:
  go2rtc:
    image: alexxit/go2rtc:1.9.15
    container_name: ken-go2rtc
    restart: unless-stopped
    env_file: .env
    ports:
      - "1984:1984"       # Web UI + API
      - "8554:8554"       # RTSP re-stream
      - "8555:8555/tcp"   # WebRTC
      - "8555:8555/udp"
    volumes:
      - ./go2rtc:/config

  dashboard:
    image: nginx:1.27-alpine
    container_name: ken-dashboard
    restart: unless-stopped
    depends_on:
      - go2rtc
    environment:
      NGINX_PORT: "80"
      GO2RTC_UPSTREAM: "go2rtc:1984"
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/templates:ro
