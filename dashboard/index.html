<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ken CCTV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="rec-dot" aria-hidden="true"></span>
      <span class="brand-name">Ken CCTV</span>
    </div>
    <div class="summary" id="summary">—</div>
    <button type="button" class="btn" id="open-playback" title="Xem lại bản ghi trên NAS">Xem lại</button>
    <time class="clock" id="clock">--:--:--</time>
  </header>

  <main class="grid" id="grid" aria-live="polite"></main>

  <dialog class="viewer" id="viewer">
    <div class="viewer-bar">
      <div class="viewer-title" id="viewer-title"></div>
      <div class="viewer-actions">
        <button type="button" class="btn" id="viewer-playback" title="Xem lại camera này">Xem lại</button>
        <button type="button" class="btn" id="viewer-snap" title="Chụp ảnh">Chụp ảnh</button>
        <button type="button" class="btn" id="viewer-audio" title="Bật/tắt tiếng">Bật tiếng</button>
        <button type="button" class="btn btn-close" id="viewer-close" title="Đóng (Esc)">Đóng</button>
      </div>
    </div>
    <div class="viewer-body" id="viewer-body"></div>
  </dialog>

  <dialog class="viewer playback" id="playback">
    <div class="viewer-bar">
      <div class="pb-pickers">
        <select class="btn" id="pb-cam" aria-label="Camera"></select>
        <select class="btn" id="pb-date" aria-label="Ngày"></select>
      </div>
      <div class="viewer-actions">
        <button type="button" class="btn" id="pb-prev" title="Đoạn trước">‹ Trước</button>
        <button type="button" class="btn" id="pb-next" title="Đoạn sau">Sau ›</button>
        <a class="btn" id="pb-download" download title="Tải đoạn đang xem">Tải về</a>
        <button type="button" class="btn btn-close" id="pb-close" title="Đóng (Esc)">Đóng</button>
      </div>
    </div>
    <div class="viewer-body pb-body">
      <video id="pb-video" controls playsinline preload="metadata"></video>
      <div class="pb-msg" id="pb-msg" hidden></div>
    </div>
    <div class="pb-foot">
      <div class="pb-time" id="pb-time">--:--:--</div>
      <div class="pb-timeline" id="pb-timeline" role="slider" tabindex="0" aria-label="Dòng thời gian trong ngày">
        <div class="pb-segs" id="pb-segs"></div>
        <div class="pb-head" id="pb-head" hidden></div>
      </div>
      <div class="pb-hours" aria-hidden="true">
        <span>00</span><span>03</span><span>06</span><span>09</span><span>12</span><span>15</span><span>18</span><span>21</span><span>24</span>
      </div>
    </div>
  </dialog>

  <template id="tile-tpl">
    <article class="tile" tabindex="0">
      <div class="tile-media"></div>
      <div class="tile-overlay">
        <div class="tile-head">
          <span class="badge"><span class="dot"></span><span class="badge-text">Đang kết nối</span></span>
          <span class="mode"></span>
        </div>
        <div class="tile-msg"></div>
        <div class="tile-foot">
          <div>
            <div class="tile-name"></div>
            <div class="tile-loc"></div>
          </div>
          <span class="tile-res"></span>
        </div>
      </div>
      <div class="tile-empty" hidden>
        <div class="tile-empty-title"></div>
        <div class="tile-empty-hint"></div>
      </div>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
